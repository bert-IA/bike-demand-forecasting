[project]
name = "bike-demand-forecasting"
version = "0.1.0"
description = "Production-oriented time series forecasting platform on Paris bike counters."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "bert-IA", email = "blouviot@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "forecasting"
