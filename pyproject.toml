[project]
name = "bike-demand-forecasting"
version = "0.1.0"
description = "Production-oriented time series forecasting platform on Paris bike counters."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "bert-IA", email = "blouviot@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandera>=0.34.1",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "forecasting"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "nbstripout>=0.9.1",
    "plotly>=7.1.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501", "B018"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
